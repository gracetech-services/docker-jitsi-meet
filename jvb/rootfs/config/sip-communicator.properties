# 全局带宽限制（默认无限制，单位：bps）
org.jitsi.videobridge.TRUST_BWE=true
org.jitsi.videobridge.ENABLE_STATISTICS=true
org.jitsi.videobridge.STATISTICS_TRANSPORT=colibri

# 单个端点的最大带宽（默认 1.5Mbps 视频 + 128Kbps 音频）
org.jitsi.impl.neomedia.rtp.adaptivesourcepacketbuffer.MAX_BITRATE=1500000
org.jitsi.impl.neomedia.rtp.adaptivesourcepacketbuffer.AUDIO_MAX_BITRATE=128000

# 启用自适应码率（ABR）
org.jitsi.videobridge.ENABLE_ADAPTIVE_BITRATE=true
